<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototipo · Hero y estilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  #stage { min-height: 100dvh; }

  /* ── Shared device frames ─────────────────────────────── */
  .frame-browser { border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 30px 60px -20px var(--shadow); }
  .frame-bar { height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); font: 500 11.5px/1 var(--f-body); color: var(--muted); }
  .frame-bar .url { flex: 1; height: 18px; border-radius: 6px; background: var(--bar); display: flex; align-items: center; padding: 0 8px; overflow: hidden; white-space: nowrap; }
  .frame-shot { aspect-ratio: 16 / 10; background: var(--bar); position: relative; overflow: hidden; }
  .frame-shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .frame-phone { width: 100%; border-radius: 26px; padding: 7px; background: var(--phone); box-shadow: 0 0 0 1px var(--line), 0 30px 50px -18px var(--shadow); }
  .frame-phone .frame-shot { aspect-ratio: 390 / 844; border-radius: 20px; }
  .noimg::after { content: attr(data-label); position: absolute; inset: 0; display: grid; place-items: center; font: 500 13px var(--f-body); color: var(--muted); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: var(--r-btn); font: 600 15px/1 var(--f-body); transition: background-color 160ms ease-out, color 160ms ease-out, transform 120ms ease-out; white-space: nowrap; }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible, .tab:focus-visible, .link:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; }
  .btn-wa { background: var(--accent); color: #fff; }
  .btn-wa:hover { background: var(--accent-hover); }
  .btn-wa svg { width: 18px; height: 18px; flex: none; }
  .btn-plain { color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .btn-plain:hover { background: var(--hover); }

  .fab { position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 50; display: none; width: 56px; height: 56px; border-radius: 50%; align-items: center; justify-content: center; background: var(--accent); color: #fff; box-shadow: 0 10px 24px -8px var(--shadow); }
  .fab svg { width: 26px; height: 26px; }
  @media (max-width: 720px) { .fab { display: flex; } }

  /* entrance: short, ease-out, transform + opacity only */
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .in { animation: rise 420ms cubic-bezier(0.23, 1, 0.32, 1) both; animation-delay: calc(var(--i, 0) * 60ms); }
  @media (prefers-reduced-motion: reduce) { .in { animation: none; } .btn, .tab { transition: none; } }

  /* ── 1 · ESTUDIO ─────────────────────────────────────── */
  .v1 {
    --bg: #0c0c0e; --surface: #141417; --bar: #1b1b1f; --phone: #1b1b1f; --line: #26262b; --line-strong: #3a3a41; --hover: #17171a;
    --text: #efeff2; --muted: #9b9ba6; --accent: #5b52f0; --accent-hover: #4d44e0; --accent-text: #a29dff; --shadow: rgba(0,0,0,.7);
    --f-display: 'Bricolage Grotesque', sans-serif; --f-body: 'Geist', system-ui, sans-serif; --r-btn: 10px;
    background: var(--bg); color: var(--text); font-family: var(--f-body); min-height: 100dvh;
  }
  .v1 .wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
  .v1 nav { display: flex; align-items: center; justify-content: space-between; height: 72px; }
  .v1 .logo { font: 800 20px/1 var(--f-display); letter-spacing: -0.02em; }
  .v1 .nav-links { display: flex; gap: 28px; font-size: 14px; color: var(--muted); }
  .v1 .nav-links a:hover { color: var(--text); }
  .v1 .hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(32px, 5vw, 72px); align-items: center; padding: clamp(40px, 8vh, 96px) 0 clamp(56px, 9vh, 112px); }
  .v1 h1 { font: 800 clamp(44px, 6.4vw, 92px)/0.96 var(--f-display); letter-spacing: -0.035em; text-wrap: balance; }
  .v1 h1 em { font-style: normal; color: var(--accent-text); }
  .v1 .sub { margin-top: 28px; max-width: 34em; font-size: clamp(16px, 1.3vw, 18px); line-height: 1.6; color: var(--muted); }
  .v1 .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
  .v1 .firma { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .v1 .firma strong { color: var(--text); font-weight: 500; }
  .v1 .empresas { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .v1 .empresas a { color: var(--text); border-bottom: 1px solid var(--line-strong); }
  .v1 .empresas a:hover { border-color: var(--text); }
  .v1 .devices { position: relative; padding-bottom: 12%; }
  .v1 .devices .frame-phone { position: absolute; width: 28%; left: -7%; bottom: 0; }
  .v1 .clientes { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 36px; padding: 28px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .v1 .clientes span { font-size: 13px; color: var(--muted); }
  .v1 .clientes b { font: 700 clamp(18px, 2vw, 24px)/1 var(--f-display); letter-spacing: -0.02em; color: var(--text); }
  .v1 .muestra { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; padding: 72px 0 120px; }
  .v1 .muestra h2 { grid-column: 1 / -1; font: 700 clamp(28px, 3.2vw, 40px)/1.05 var(--f-display); letter-spacing: -0.03em; }
  .v1 .proj { display: grid; gap: 18px; }
  .v1 .proj h3 { font: 700 22px/1.2 var(--f-display); letter-spacing: -0.02em; }
  .v1 .proj p { color: var(--muted); line-height: 1.6; font-size: 15px; max-width: 46ch; }
  .v1 .facts { display: flex; flex-wrap: wrap; gap: 8px; }
  .v1 .facts li { list-style: none; font-size: 13px; padding: 6px 10px; border-radius: 6px; background: var(--bar); color: var(--text); }
  .v1 .plan { border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 16px; background: var(--surface); }
  .v1 .plan h3 { font: 700 22px/1.1 var(--f-display); }
  .v1 .plan .para { font-size: 14px; color: var(--muted); }
  .v1 .plan ul { display: grid; gap: 10px; font-size: 15px; }
  .v1 .plan li { list-style: none; padding-left: 20px; position: relative; }
  .v1 .plan li::before { content: ''; position: absolute; left: 0; top: .6em; width: 8px; height: 1.5px; background: var(--accent-text); }
  .v1 .precio { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line); }
  .v1 .precio small { display: block; font-size: 13px; color: var(--muted); }
  .v1 .precio b { font: 800 34px/1.1 var(--f-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) {
    .v1 .hero, .v1 .muestra { grid-template-columns: minmax(0, 1fr); }
    .v1 .devices { margin-left: 8%; }
    .v1 .nav-links { display: none; }
  }

  /* ── 2 · VITRINA ─────────────────────────────────────── */
  .v2 {
    --bg: #09090b; --surface: #111114; --bar: #18181c; --phone: #18181c; --line: #232328; --line-strong: #37373e; --hover: #141417;
    --text: #f4f4f6; --muted: #9696a0; --accent: #5b52f0; --accent-hover: #4d44e0; --accent-text: #a29dff; --shadow: rgba(0,0,0,.75);
    --f-display: 'Instrument Sans', sans-serif; --f-body: 'Instrument Sans', system-ui, sans-serif; --r-btn: 999px;
    background: var(--bg); color: var(--text); font-family: var(--f-body); min-height: 100dvh;
  }
  .v2 .wrap { max-width: 1280px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
  .v2 nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .v2 .logo { font: 700 17px/1 var(--f-display); }
  .v2 .logo span { color: var(--muted); font-weight: 500; }
  .v2 .nav-links { display: flex; gap: 26px; font-size: 14px; color: var(--muted); }
  .v2 .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 48px; align-items: end; padding: clamp(28px, 6vh, 64px) 0 32px; }
  .v2 h1 { font: 600 clamp(36px, 4.6vw, 64px)/1.02 var(--f-display); letter-spacing: -0.035em; max-width: 15em; text-wrap: balance; }
  .v2 .sub { margin-top: 18px; max-width: 40em; font-size: 17px; line-height: 1.55; color: var(--muted); }
  .v2 .ctas { display: flex; flex-wrap: wrap; gap: 10px; }
  .v2 .show { border-radius: 20px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); padding: clamp(14px, 2vw, 24px); }
  .v2 .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
  .v2 .tab { border: 0; background: transparent; color: var(--muted); font: 500 14px/1 var(--f-body); height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer; transition: background-color 150ms ease-out, color 150ms ease-out; }
  .v2 .tab:hover { color: var(--text); }
  .v2 .tab[aria-selected="true"] { background: var(--bar); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .v2 .stage-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.24fr); gap: clamp(12px, 2vw, 24px); align-items: end; }
  .v2 .info { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; margin-top: 18px; font-size: 14px; color: var(--muted); }
  .v2 .info b { color: var(--text); font-weight: 600; }
  .v2 .info .link { color: var(--accent-text); }
  .v2 .empresas { padding: 28px 0 0; font-size: 15px; color: var(--muted); }
  .v2 .empresas a { color: var(--text); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line-strong); }
  .v2 .muestra { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 72px 0 120px; }
  .v2 .card { border-radius: 20px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  .v2 .card h3 { font: 600 24px/1.15 var(--f-display); letter-spacing: -0.02em; }
  .v2 .card p { color: var(--muted); line-height: 1.6; font-size: 15px; }
  .v2 .row { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); }
  .v2 .row small { display: block; color: var(--muted); font-size: 13px; }
  .v2 .row b { font: 600 32px/1.1 var(--f-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .v2 .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .v2 .chips span { font-size: 13px; padding: 6px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line-strong); }
  @media (max-width: 900px) {
    .v2 .top, .v2 .muestra { grid-template-columns: minmax(0, 1fr); }
    .v2 .stage-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 0.34fr); }
    .v2 .nav-links { display: none; }
  }

  /* ── 3 · CLARO ───────────────────────────────────────── */
  .v3 {
    --bg: #f5f4ef; --surface: #ffffff; --bar: #ecebe5; --phone: #1c1c21; --line: #dedcd3; --line-strong: #c4c1b6; --hover: #ecebe5;
    --text: #17171b; --muted: #5a5a63; --accent: #4a3fd4; --accent-hover: #3d33bd; --accent-text: #4a3fd4; --shadow: rgba(40,36,20,.28);
    --f-display: 'Instrument Serif', Georgia, serif; --f-body: 'Geist', system-ui, sans-serif; --r-btn: 8px;
    background: var(--bg); color: var(--text); font-family: var(--f-body); min-height: 100dvh;
  }
  .v3 .wrap { max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
  .v3 nav { display: flex; align-items: center; justify-content: space-between; height: 72px; border-bottom: 1px solid var(--line); }
  .v3 .logo { font: 400 24px/1 var(--f-display); }
  .v3 .nav-links { display: flex; gap: 28px; font-size: 14px; color: var(--muted); }
  .v3 .hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 88px); padding: clamp(48px, 9vh, 104px) 0 clamp(48px, 8vh, 88px); align-items: start; }
  .v3 h1 { font: 400 clamp(46px, 6.2vw, 90px)/0.98 var(--f-display); letter-spacing: -0.02em; text-wrap: balance; }
  .v3 h1 em { font-style: italic; color: var(--accent); }
  .v3 .sub { margin-top: 26px; max-width: 32em; font-size: 18px; line-height: 1.6; color: var(--muted); }
  .v3 .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .v3 .ficha { border-top: 2px solid var(--text); }
  .v3 .ficha div { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.55; }
  .v3 .ficha dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
  .v3 .ficha dd a { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line-strong); }
  .v3 .ficha dd a:hover { text-decoration-color: var(--text); }
  .v3 .firma { margin-top: 22px; font-size: 14px; color: var(--muted); }
  .v3 .firma strong { color: var(--text); font-weight: 600; }
  .v3 .strip { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 0.42fr); gap: clamp(12px, 2vw, 24px); align-items: end; padding-bottom: 24px; }
  .v3 .strip figcaption { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .v3 .strip figcaption b { color: var(--text); font-weight: 600; }
  .v3 .muestra { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; margin: 80px 0 120px; border-top: 2px solid var(--text); }
  .v3 .muestra > * { padding: 32px 32px 0 0; }
  .v3 .muestra > * + * { padding-left: 32px; border-left: 1px solid var(--line); }
  .v3 .muestra h3 { font: 400 34px/1.05 var(--f-display); }
  .v3 .muestra p { margin-top: 12px; color: var(--muted); line-height: 1.6; font-size: 15px; max-width: 42ch; }
  .v3 .muestra ul { margin-top: 18px; display: grid; gap: 8px; font-size: 15px; }
  .v3 .muestra li { list-style: none; padding-left: 18px; position: relative; }
  .v3 .muestra li::before { content: '—'; position: absolute; left: 0; color: var(--muted); }
  .v3 .precio { margin-top: 22px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .v3 .precio small { font-size: 13px; color: var(--muted); }
  .v3 .precio b { font: 400 44px/1 var(--f-display); font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) {
    .v3 .hero, .v3 .muestra { grid-template-columns: minmax(0, 1fr); }
    .v3 .muestra > * + * { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); margin-top: 32px; }
    .v3 .strip { grid-template-columns: minmax(0, 1fr) minmax(0, 0.36fr); }
    .v3 .strip .only-wide { display: none; }
    .v3 .nav-links { display: none; }
  }

  /* ── Picker (verbatim from PICKER.md) ─────────────────── */
  .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
  .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
  .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<main id="stage"></main>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Estudio</button>
  <button class="proto-picker-item">Vitrina</button>
  <button class="proto-picker-item">Claro</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const WA = 'https://wa.me/542995560164?text=' + encodeURIComponent('Hola Matias, vi tu página y quiero consultarte por una web para mi negocio.');
const WA_EMPRESA = 'https://wa.me/542995560164?text=' + encodeURIComponent('Hola Matias, te escribo por un proyecto a medida para una empresa.');
const WA_LANDING = 'https://wa.me/542995560164?text=' + encodeURIComponent('Hola Matias, me interesa el plan Landing Page.');
const IMG = '../assets/proyectos/';
const waIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4C2.7 15.6 2.2 13.8 2.2 12 2.2 6.6 6.6 2.2 12 2.2S21.8 6.6 21.8 12 17.4 21.8 12 21.8zM12 0C5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6c1.8 1 3.8 1.5 5.8 1.5 6.6 0 12-5.4 12-12S18.6 0 12 0z"/></svg>';

const shot = (file, label) => `<div class="frame-shot" data-label="${label}"><img src="${IMG}${file}" alt="Captura de ${label}" loading="lazy" onerror="this.remove();this.parentElement&&this.parentElement.classList.add('noimg')"></div>`;
const browser = (file, label, url) => `<div class="frame-browser"><div class="frame-bar"><span class="url">${url}</span></div>${shot(file, label)}</div>`;
const phone = (file, label) => `<div class="frame-phone">${shot(file, label)}</div>`;
const fab = `<a class="fab" href="${WA}" target="_blank" rel="noopener" aria-label="Escribime por WhatsApp">${waIcon}</a>`;
const links = `<div class="nav-links"><a href="#">Trabajos</a><a href="#">Planes</a><a href="#">Cómo trabajo</a><a href="#">Contacto</a></div>`;

const variants = [
  // 1 · Estudio
  () => `
  <div class="v v1">
    <div class="wrap">
      <nav><span class="logo">Matias Lopez</span>${links}</nav>
      <section class="hero">

/* Vitrina tabs: switches the showcased project (instant swap, no animation) */
const showcase = [

];
function renderPanel(root, i) {
  const p = showcase[i];
  root.querySelector('[data-panel]').innerHTML = `
    <div class="stage-grid">${browser(p.d, p.name, p.url)}${phone(p.m, p.name)}</div>
    <div class="info"><span><b>${p.name}</b> · ${p.what}</span><a class="link" href="https://${p.url}" target="_blank" rel="noopener">Ver sitio →</a></div>`;
  root.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', String(j === i)));
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('.tab'); if (!t) return;
  renderPanel(t.closest('[data-show]'), +t.dataset.p);
});
new MutationObserver(() => { const s = document.querySelector('[data-show]'); if (s && !s.dataset.init) { s.dataset.init = 1; renderPanel(s, 0); } })
  .observe(document.getElementById('stage'), { childList: true });

/* ── Picker wiring (verbatim from PICKER.md) ── */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); }); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
