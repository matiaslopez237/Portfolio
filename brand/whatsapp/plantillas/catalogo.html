<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Tarjeta de catálogo 800×800 · Hefesto Webs</title>
<!--
  Tarjeta del catálogo de WhatsApp Business (HU-05). La usa node brand/whatsapp/generar.mjs con los datos en el hash:
  catalogo.html#{"nombre":"Landing Page","precioTexto":"$150.000","ideal":"...","items":["..."]}
  WhatsApp muestra la miniatura recortada en cuadrado: lo importante va lejos de los bordes. Colores: solo los de brand/tokens.json.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 800px; height: 800px; overflow: hidden; }
  body { font-family: 'Public Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .pieza { position: relative; width: 800px; height: 800px; padding: 64px 68px; background: #1b2128; color: #eef1f4; }
  .cond { font-family: 'Archivo', sans-serif; font-variation-settings: "wdth" 70; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }
  .arriba { display: flex; align-items: center; justify-content: space-between; }
  .simbolo { width: 64px; height: 64px; }
  .etiqueta { font-size: 20px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #9aa6b2; }
  h1 { margin-top: 36px; font-size: 96px; line-height: .88; }
  .barra { width: 52px; height: 7px; margin-top: 24px; background: #ff7a1a; }
  .ideal { margin-top: 22px; font-size: 26px; color: #9aa6b2; }
  ul { list-style: none; margin-top: 24px; display: grid; gap: 6px; }
  li { display: grid; grid-template-columns: 34px 1fr; align-items: baseline; font-size: 27px; font-weight: 500; }
  li::before { content: ''; width: 18px; height: 4px; background: #ff7a1a; transform: translateY(-7px); }
  .precio { position: absolute; left: 68px; right: 68px; bottom: 56px; display: flex; align-items: baseline; justify-content: space-between; padding-top: 22px; border-top: 2px solid #323c47; }
  .precio small { font-size: 22px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #9aa6b2; }
  .precio b { font-size: 84px; line-height: .9; color: #ff7a1a; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="pieza" id="pieza"></div>
<script>
  const ejemplo = { nombre: 'Landing Page', precioTexto: '$150.000', ideal: 'Plantilla de ejemplo', items: ['Uno', 'Dos', 'Tres'] };
  const d = location.hash.length > 1 ? JSON.parse(decodeURIComponent(location.hash.slice(1))) : ejemplo;
  const simbolo = `<svg class="simbolo" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 4 L90 27 V73 L50 96 L10 73 V27 Z" fill="none" stroke="#eef1f4" stroke-width="5" stroke-linejoin="round"/>
    <path d="M36 29 L26 39.5 L36 50 M64 29 L74 39.5 L64 50" fill="none" stroke="#eef1f4" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55.5 26 L44.5 53" stroke="#ff7a1a" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M24 61 H76 V66.5 C70 67.5 65 69 61 71 V75 H66 V80.5 H34 V75 H39 V71 C35 69 30 67.5 24 65.5 Z" fill="#eef1f4"/></svg>`;
  document.getElementById('pieza').innerHTML = `
    <div class="arriba">${simbolo}<span class="etiqueta">Hefesto Webs · Plan</span></div>
    <h1 class="cond">${d.nombre}</h1>
    <div class="barra"></div>
    <p class="ideal">${d.ideal}</p>
    <ul>${d.items.map(i => `<li>${i}</li>`).join('')}</ul>
    <div class="precio"><small>Desde</small><b class="cond">${d.precioTexto}</b></div>`;
</script>
</body>
</html>
