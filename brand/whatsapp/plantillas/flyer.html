<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Flyer 1080×1920 · Efesto Webs</title>
<!--
  Flyer para estados de WhatsApp, historias y para imprimir (HU-05). Lo usa node brand/whatsapp/generar.mjs con los datos en el hash:
  flyer.html#{"precios":[["Landing Page","$150.000"],...],"numeroVisible":"260 466-1138","horario":"..."}
  El QR (../qr-whatsapp.png) lo genera el mismo script y abre el chat con un mensaje listo.
  Zona segura: nada importante en los 250 px de arriba ni de abajo. Colores: solo los de brand/tokens.json.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: 'Public Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .pieza { position: relative; width: 1080px; height: 1920px; padding: 260px 100px 0; background: #1b2128; color: #eef1f4; }
  .cond { font-family: 'Archivo', sans-serif; font-variation-settings: "wdth" 70; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }
  .marca { display: flex; align-items: center; gap: 22px; }
  .marca svg { width: 92px; height: 92px; }
  .marca span { font-size: 58px; letter-spacing: .02em; }
  .marca b { color: #9aa6b2; font-weight: 800; }
  h1 { margin-top: 70px; font-size: 128px; line-height: .86; }
  h1 em { font-style: normal; color: #ff7a1a; }
  .barra { width: 72px; height: 9px; margin-top: 34px; background: #ff7a1a; }
  .precios { margin-top: 48px; border-top: 2px solid #323c47; }
  .precios div { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 0; border-bottom: 2px solid #323c47; }
  .precios span { font-size: 44px; font-weight: 700; }
  .precios small { font-size: 26px; font-weight: 700; letter-spacing: .12em; color: #9aa6b2; margin-right: 18px; }
  .precios b { font-size: 68px; line-height: 1; font-variant-numeric: tabular-nums; }
  .contacto { position: absolute; left: 100px; right: 100px; bottom: 270px; display: grid; grid-template-columns: 320px 1fr; gap: 48px; align-items: center; }
  .qr { width: 320px; height: 320px; border-radius: 16px; display: block; }
  .contacto p { font-size: 34px; line-height: 1.3; color: #9aa6b2; }
  .contacto .cta { font-size: 64px; line-height: .95; color: #eef1f4; }
  .contacto .numero { margin-top: 20px; font-size: 60px; white-space: nowrap; color: #ff7a1a; font-variant-numeric: tabular-nums; }
  .contacto .horario { margin-top: 12px; font-size: 30px; }
  .contacto .etiqueta-wa { margin-top: 26px; font-size: 26px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .contacto .etiqueta-wa + .numero { margin-top: 4px; }
</style>
</head>
<body>
<div class="pieza" id="pieza"></div>
<script>
  const ejemplo = { precios: [['Landing Page', '$000.000']], numeroVisible: '000 000-0000', horario: 'Plantilla de ejemplo' };
  const d = location.hash.length > 1 ? JSON.parse(decodeURIComponent(location.hash.slice(1))) : ejemplo;
  const simbolo = `<svg viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 4 L90 27 V73 L50 96 L10 73 V27 Z" fill="none" stroke="#eef1f4" stroke-width="5" stroke-linejoin="round"/>
    <path d="M36 29 L26 39.5 L36 50 M64 29 L74 39.5 L64 50" fill="none" stroke="#eef1f4" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55.5 26 L44.5 53" stroke="#ff7a1a" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M24 61 H76 V66.5 C70 67.5 65 69 61 71 V75 H66 V80.5 H34 V75 H39 V71 C35 69 30 67.5 24 65.5 Z" fill="#eef1f4"/></svg>`;
  document.getElementById('pieza').innerHTML = `
    <div class="marca">${simbolo}<span class="cond">Efesto <b>Webs</b></span></div>
    <h1 class="cond">Páginas web forjadas <em>a medida</em></h1>
    <div class="barra"></div>
    <div class="precios">${d.precios.map(([n, p]) => `<div><span>${n}</span><span><small>DESDE</small><b class="cond">${p}</b></span></div>`).join('')}</div>
    <div class="contacto">
      <img class="qr" src="../qr-whatsapp.png" alt="QR para escribir por WhatsApp" />
      <div>
        <p class="cta cond">Escaneá y escribime</p>
        <p class="etiqueta-wa">WhatsApp</p><p class="numero cond">${d.numeroVisible}</p>
        <p class="horario">${d.horario}</p>
      </div>
    </div>`;
</script>
</body>
</html>
