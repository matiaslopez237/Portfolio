<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Plantilla de post 1080×1350 · Efesto Webs</title>
<!--
  Plantilla de post de Instagram (HU-04). Se usa con node brand/instagram/generar.mjs, que le pasa los datos
  en el hash de la URL: post.html#{"tipo":"plan","nombre":"Landing Page",...}
  Tipos: frase · trabajo · plan · proceso · consejo. Colores: solo los de brand/tokens.json.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: 'Public Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .pieza { position: relative; width: 1080px; height: 1350px; padding: 96px 96px 0; background: #1b2128; color: #eef1f4; }
  .cond { font-family: 'Archivo', sans-serif; font-variation-settings: "wdth" 70; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }
  .simbolo { width: 104px; height: 104px; display: block; }
  .pie { position: absolute; left: 96px; right: 96px; bottom: 80px; display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 500; letter-spacing: .14em; color: #9aa6b2; }
  .pie .marca { color: #eef1f4; font-family: 'Archivo', sans-serif; font-variation-settings: "wdth" 70; font-weight: 800; font-size: 34px; letter-spacing: .02em; }
  .pie .marca b { color: #ff7a1a; }
  .barra { width: 88px; height: 12px; border-radius: 3px; background: #ff7a1a; }

  /* frase / consejo */
  .t-frase h1 { font-size: 150px; line-height: .88; margin-top: 150px; }
  .t-frase h1 em { font-style: normal; color: #ff7a1a; }
  .t-frase p { margin-top: 64px; font-size: 40px; line-height: 1.45; color: #9aa6b2; max-width: 820px; }
  .t-consejo h1 { font-size: 104px; line-height: .92; margin-top: 110px; }
  .lista { margin-top: 70px; display: grid; gap: 34px; list-style: none; }
  .lista li { display: grid; grid-template-columns: 80px 1fr; align-items: baseline; font-size: 44px; line-height: 1.3; font-weight: 500; }
  .lista li span { font-family: 'Archivo', sans-serif; font-variation-settings: "wdth" 70; font-weight: 800; color: #ff7a1a; font-size: 54px; }

  /* trabajo */
  .t-trabajo { background: #222a33; }
  .t-trabajo h1 { font-size: 128px; line-height: .9; margin-top: 60px; }
  .t-trabajo .detalle { margin-top: 22px; font-size: 34px; color: #9aa6b2; }
  .compu { position: absolute; left: 96px; right: 96px; top: 520px; border-radius: 22px; overflow: hidden; background: #323c47; border: 4px solid #323c47; }
  .compu .bar { height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 20px; }
  .compu .bar i { width: 14px; height: 14px; border-radius: 50%; background: #9aa6b2; }
  .compu .bar i:first-child { background: #ff7a1a; }
  .compu img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; }
  .celular { position: absolute; left: 50%; transform: translateX(-50%); bottom: 150px; width: 280px; border-radius: 52px; padding: 14px; background: #323c47; }
  .celular img { display: block; width: 100%; aspect-ratio: 390 / 844; border-radius: 40px; object-fit: cover; object-position: top; }
  .t-trabajo .celular ~ .pie { bottom: 64px; }

  /* plan */
  .t-plan { background: #ff7a1a; color: #1b2128; }
  .t-plan .simbolo path[stroke="#ff7a1a"] { stroke: #1b2128; }
  .t-plan h1 { font-size: 136px; line-height: .88; margin-top: 120px; }
  .t-plan .desde { margin-top: 44px; font-size: 38px; font-weight: 700; letter-spacing: .1em; }
  .t-plan .precio { font-family: 'Archivo', sans-serif; font-variation-settings: "wdth" 70; font-weight: 800; font-size: 170px; line-height: .9; font-variant-numeric: tabular-nums; }
  .t-plan .lista li { font-size: 40px; grid-template-columns: 64px 1fr; }
  .t-plan .lista li span { color: #1b2128; }
  .t-plan .pie, .t-plan .pie .marca { color: #1b2128; }
  .t-plan .pie .marca b { color: #1b2128; }
  .t-plan .barra { background: #1b2128; }

  /* proceso */
  .t-proceso h1 { font-size: 132px; line-height: .9; margin-top: 90px; }
  .pasos { margin-top: 70px; display: grid; gap: 34px; list-style: none; }
  .pasos li { display: grid; grid-template-columns: 96px 1fr; padding-top: 30px; border-top: 3px solid #323c47; }
  .pasos .num { font-family: 'Archivo', sans-serif; font-variation-settings: "wdth" 70; font-weight: 800; font-size: 64px; color: #ff7a1a; line-height: 1; }
  .pasos b { display: block; font-family: 'Archivo', sans-serif; font-variation-settings: "wdth" 70; font-weight: 800; text-transform: uppercase; font-size: 48px; line-height: 1; }
  .pasos p { margin-top: 10px; font-size: 32px; color: #9aa6b2; }
</style>
</head>
<body>
<div id="pieza" class="pieza"></div>
<script>
  // Datos de ejemplo si se abre la plantilla sola en el navegador.
  const ejemplo = { tipo: 'frase', titulo: 'Páginas web forjadas a medida.', texto: 'Plantilla de ejemplo: los datos reales vienen de brand/instagram/contenido.json.' };
  const d = location.hash.length > 1 ? JSON.parse(decodeURIComponent(location.hash.slice(1))) : ejemplo;
  const img = (archivo) => `../../../assets/proyectos/${archivo}`;
  const simbolo = `<svg class="simbolo" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 4 L90 27 V73 L50 96 L10 73 V27 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
    <path d="M36 29 L26 39.5 L36 50 M64 29 L74 39.5 L64 50" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55.5 26 L44.5 53" stroke="#ff7a1a" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M24 61 H76 V66.5 C70 67.5 65 69 61 71 V75 H66 V80.5 H34 V75 H39 V71 C35 69 30 67.5 24 65.5 Z" fill="currentColor"/></svg>`;
  const pie = `<div class="pie"><span class="marca">EFESTO <b>WEBS</b></span><span class="barra"></span></div>`;
  const resaltar = (t) => t.replace(/(forjadas?|a medida)/i, '<em>$1</em>');
  const lista = (items) => `<ul class="lista">${items.map((x, i) => `<li><span>${i + 1}</span>${x}</li>`).join('')}</ul>`;

  const tipos = {
    frase: () => `${simbolo}<h1 class="cond">${resaltar(d.titulo)}</h1><p>${d.texto}</p>${pie}`,
    consejo: () => `${simbolo}<h1 class="cond">${d.titulo}</h1>${lista(d.items)}${pie}`,
    trabajo: () => `${simbolo}<h1 class="cond">${d.nombre}</h1><p class="detalle">${d.detalle}</p>
      ${d.marco === 'celular' ? `<div class="celular"><img src="${img(d.imagen)}" alt=""></div>` : `<div class="compu"><div class="bar"><i></i><i></i><i></i></div><img src="${img(d.imagen)}" alt=""></div>`}${pie}`,
    plan: () => `${simbolo}<h1 class="cond">${d.nombre}</h1><p class="desde">DESDE</p><p class="precio">${d.precioTexto}</p>${lista(d.items)}${pie}`,
    proceso: () => `${simbolo}<h1 class="cond">${d.titulo}</h1><ol class="pasos">${d.pasos.map(([t, p], i) => `<li><span class="num">${i + 1}</span><div><b>${t}</b><p>${p}</p></div></li>`).join('')}</ol>${pie}`,
  };
  const el = document.getElementById('pieza');
  el.classList.add('t-' + d.tipo);
  el.innerHTML = tipos[d.tipo]();
</script>
</body>
</html>
