# Publica en Instagram el post que toca hoy según brand/instagram/calendario.md (HU-10).
# Corre todos los días a las 18:00 y a las 19:00 de Argentina (21:00 y 22:00 UTC): GitHub suele atrasar
# las tareas programadas (DEF-01), así que la que llega primero publica y la otra no encuentra nada.
# Si las dos se atrasan al día siguiente, igual publica lo pendiente de hasta 2 días antes (RN-10.8).
# También se puede lanzar a mano desde GitHub › Actions › "Publicar en Instagram" › Run workflow.
# Necesita dos secrets (GitHub › Settings › Secrets and variables › Actions): IG_USER_ID e IG_ACCESS_TOKEN.
name: Publicar en Instagram

on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a publicar (AAAA-MM-DD). Vacío = hoy'
        required: false
      verificar:
        description: 'Solo verificar la conexión con Instagram (no publica)'
        type: boolean
        default: false
      prueba:
        description: 'Modo prueba: muestra qué publicaría, sin publicar'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar el post del día
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FECHA: ${{ inputs.fecha }}
          PRUEBA: ${{ inputs.prueba }}
          VERIFICAR: ${{ inputs.verificar }}
        run: |
          ARGS=""
          if [ -n "$FECHA" ]; then ARGS="$ARGS --fecha=$FECHA"; fi
          if [ "$PRUEBA" = "true" ]; then ARGS="$ARGS --prueba"; fi
          if [ "$VERIFICAR" = "true" ]; then ARGS="--verificar"; fi
          node scripts/publicar-instagram.mjs $ARGS

      - name: Guardar el registro de lo publicado
        run: |
          if git diff --quiet -- brand/instagram/publicados.json; then exit 0; fi
          git config user.name "hefesto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/instagram/publicados.json
          git commit -m "chore: registro de publicación en Instagram"
          git push
